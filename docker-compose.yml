name: vkr-blog

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vkr-blog/app:latest
    container_name: vkr-blog-app
    restart: unless-stopped
    logging: *default-logging
    ports:
      # По умолчанию только localhost: наружу сайт отдаёт Caddy по HTTPS.
      # Для доступа по локальной сети: APP_BIND=0.0.0.0 в .env.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    # Локальный .env (в git не попадает) даёт APP_KEY и остальные настройки.
    # Переменные из блока environment имеют приоритет над .env.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: ${APP_LOCALE:-ru}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-ru}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-blog}
      DB_SEED: ${DB_SEED:-false}
      LOG_CHANNEL: stderr
    volumes:
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # HTTPS-прокси: Caddy сам получает и продлевает сертификат Let's Encrypt.
  # Запуск: docker compose --profile https up -d --build
  # Нужны APP_DOMAIN и ACME_EMAIL в .env, A-запись домена и открытые 80/443.
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: vkr-blog-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-example.ru}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.ru}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: vkr-blog-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blog}
      POSTGRES_USER: ${DB_USERNAME:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blog}
      TZ: Europe/Moscow
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blog} -d ${DB_DATABASE:-blog}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Одноразовый прогон тестов: образ с dev-пакетами (phpunit), sqlite :memory:.
  # Запуск: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPOSER_NO_DEV: "0"
    image: vkr-blog/app:test
    container_name: vkr-blog-tests
    entrypoint: ["php", "artisan", "test"]
    environment:
      APP_ENV: testing

volumes:
  storage:
  db:
  caddy_data:
  caddy_config:
