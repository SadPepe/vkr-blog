; Настройки PHP для контейнера (монтируется в conf.d как zz-app.ini)

memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 60
max_input_time = 60
max_file_uploads = 20

expose_php = Off

; Файлы в образе неизменяемы, но validate_timestamps=1 оставляет возможность
; подменять код bind-mount'ом при отладке без пересборки образа.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = Europe/Moscow
